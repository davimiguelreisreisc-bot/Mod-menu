name: Build Mod Menu APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gerar Wrapper Oficial do Gradle 8.8 na Nuvem
        run: |
          wget https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          gradle-8.8/bin/gradle wrapper --gradle-version 8.8

      - name: Compilar APK (Debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Debug
          path: app/build/outputs/apk/debug/*.apk
          
