name: Build Mod Menu APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixar Gradle Wrapper Automaticamente
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/8.8/subprojects/wrapper/src/shared/resources/gradle-wrapper.jar

      - name: Build APK com Gradle 8.8
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Debug
          path: app/build/outputs/apk/debug/*.apk
          
